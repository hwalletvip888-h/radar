<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>风险榜 · 海豚Radar</title>
<meta name="description" content="海豚Radar 链上风险榜：实锤作弊、疑似作弊（被夺最优 + 被加反例），逐电路风险分，实时更新。">
<meta name="theme-color" content="#0f0c17">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="brand/favicon-64.png">
<style>
:root{
  --bg:#0f0c17;--panel:#1b1527;--panel-2:#16111f;--panel-3:#272139;
  --line:rgba(206,194,240,.09);--line-2:rgba(206,194,240,.16);--line-3:rgba(206,194,240,.28);
  --text:#F5F2FB;--text-2:#CEC7DF;--muted:#968EAE;--faint:#6D6686;
  --lav-hi:#C3B4F0;--danger:#FF7389;--warn:#F6C66F;--ok:#74E2BF;--orange:#FFA07A;
  --holo:linear-gradient(110deg,#F6C8DE 0%,#D9C6F4 28%,#AE9DE8 52%,#C2E6F6 80%,#EEF9FC 100%);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:40;background:rgba(15,12,23,.74);backdrop-filter:saturate(150%) blur(16px);-webkit-backdrop-filter:saturate(150%) blur(16px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1080px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:40px;height:auto}
.brand-name{font-size:18px;font-weight:800}
.brand-name b{background:var(--holo);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);font-size:12.5px;font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--line-3)}
.main{max-width:1080px;margin:0 auto;padding:36px 20px 80px}
.hero h1{font-size:28px;font-weight:800;margin:4px 0}
.hero p{color:var(--muted);font-size:14px;margin-top:4px}
.livechip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line-2);color:var(--text-2);margin-top:10px}
.livechip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.livechip.off .dot{background:var(--muted);box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat .v{font-size:26px;font-weight:800}
.stat .k{font-size:12px;color:var(--muted);margin-top:4px}
.stat .v.confirmed{color:var(--danger)} .stat .v.high{color:var(--orange)} .stat .v.mid_high{color:var(--warn)} .stat .v.mid{color:var(--muted)}
.bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--holo);color:#1B1527;font-weight:800;border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:60px;background:var(--bg)}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;font-weight:800;text-align:center;border-radius:6px;padding:1px 8px;font-size:12px}
.badge.高危{background:rgba(255,115,137,.16);color:var(--danger)}
.badge.中危{background:rgba(246,198,111,.16);color:var(--warn)}
.badge.低危{background:rgba(150,142,174,.16);color:var(--muted)}
.mono{font-family:var(--mono)}
.suspect{font-size:12px}
.suspect.confirmed{color:var(--danger)}
.suspect.high{color:var(--orange)}
.suspect.mid_high{color:var(--warn)}
.suspect.mid{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="brand/logo-mark-tight-w256.webp" width="40" height="30" alt="">
      <span class="brand-name">海豚<b>Radar</b></span>
    </a>
    <a class="btn" href="index.html">← 返回雷达</a>
  </div>
</header>

<main class="main">
  <div class="hero">
    <h1>链上风险榜</h1>
    <p>从「报事件」升级到「判风险」——实锤作弊、疑似作弊（被夺最优 + 被加反例），逐电路风险分。</p>
    <span class="livechip" id="liveChip"><span class="dot"></span><span id="liveText">正在连接实时数据…</span></span>
  </div>

  <div class="stats" id="stats"></div>

  <div class="bar" id="filters"></div>

  <table>
    <thead>
      <tr><th>等级</th><th>电路</th><th>处理器</th><th>风险分</th><th>嫌疑</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>实时数据暂不可用，请稍后刷新。</div>
</main>

<script>
const API = 'https://api.radar.hvip.one';
const SUSPECT_LABEL = { confirmed:'实锤作弊', high:'高嫌疑', mid_high:'中高嫌疑', mid:'中嫌疑', none:'无' };

async function load(){
  let state;
  try {
    const rt = await fetch(API + '/api/risks?limit=5000', {cache:'no-cache'}).then(r => r.json());
    state = { live: true, items: rt.items || [] };
  } catch (e) {
    document.getElementById('empty').hidden = false;
    document.getElementById('liveText').textContent = '实时数据不可用';
    document.getElementById('liveChip').classList.add('off');
    return;
  }
  render(state);
}

function render(state){
  const items = state.items;
  const cnt = k => items.filter(x => x.suspect === k).length;

  // 顶部统计
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="v confirmed">${cnt('confirmed')}</div><div class="k">实锤作弊（撤销）</div></div>
    <div class="stat"><div class="v high">${cnt('high')}</div><div class="k">高嫌疑（夺最优+反例）</div></div>
    <div class="stat"><div class="v mid_high">${cnt('mid_high')}</div><div class="k">中高嫌疑（反例题）</div></div>
    <div class="stat"><div class="v mid">${cnt('mid')}</div><div class="k">中嫌疑（仅夺最优）</div></div>`;

  // 实时标记
  const chip = document.getElementById('liveChip'), txt = document.getElementById('liveText');
  txt.textContent = `实时 · 共 ${items.length} 台电路有风险信号 · 数据自动更新`;
  chip.classList.remove('off');

  // 过滤 chips
  const filters = [['all','全部'],['confirmed','实锤'],['high','高嫌疑'],['mid_high','中高'],['mid','中']];
  let cur = 'all';
  const fEl = document.getElementById('filters');
  fEl.innerHTML = filters.map(([k,v]) => `<span class="chip${k===cur?' on':''}" data-k="${k}">${v}</span>`).join('');
  fEl.onclick = (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    cur = chip.dataset.k;
    fEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c===chip));
    renderRows();
  };

  function renderRows(){
    const list = items.filter(x => cur==='all' || x.suspect===cur);
    const rows = document.getElementById('rows');
    rows.innerHTML = list.map(x => `
      <tr>
        <td><span class="badge ${x.level}">${x.level}</span></td>
        <td class="mono">#${x.circuit_id}${x.task_id ? ` · 题${x.task_id}` : ''}</td>
        <td>${x.processor || '—'}</td>
        <td class="mono">${x.risk}</td>
        <td class="suspect ${x.suspect}">${(x.labels || []).join('、') || '—'}</td>
      </tr>`).join('') || '<tr><td colspan="5" class="empty">无数据</td></tr>';
  }
  renderRows();
}

load();
</script>
</body>
</html>
